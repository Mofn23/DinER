name: Build iOS IPA (SideStore Compatible)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Add & Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS Xcode App & Package IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r DinER.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinER-iOS-IPA
          path: ios/App/build/DinER.ipa

      - name: Release IPA on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          name: DinER Native iOS App v4.0.0 (SideStore IPA)
          body: |
            ## DinER Native iOS App v4.0.0 (SideStore / AltStore Compatible)
            
            ### ⚡ iPhone Action Button Text Prompt, Apple Pay Automations & Native iOS Widgets:
            - **iPhone Action Button Text Prompt (`diner://prompt?text=...`)**: Pressing the iPhone Action Button opens a native iOS prompt bar. Type free text (e.g. *"Me gasté 20000 en Dominos pizza #debito"*) and Gemini 2.0 Flash AI categorizes, sets title, amount, category `Comida 🍲`, and tags automatically!
            - **Apple Pay Automatic Transaction Creation**: iOS Shortcuts automation automatically forwards Apple Pay purchases to `diner://prompt?text=...` to record transactions in real-time.
            - **Native iOS Widgets (WidgetKit SwiftUI)**: Added Home Screen (Small/Medium) and Lock Screen (Circular/Inline) widgets displaying your live remaining balance.
            - **Shortcuts & Action Button Tutorial Panel**: New step-by-step guide in Settings ⚙️ for easy 1-minute setup on your iPhone.
            
            ### 🚀 SideStore Installation Instructions:
            1. Download `DinER.ipa` attached below to your iPhone.
            2. Open **SideStore** (or AltStore) on your iPhone.
            3. Tap **My Apps** ➔ **`+`** ➔ Select `DinER.ipa`.
            4. Enjoy DinER running 100% natively on your iPhone!
          files: ios/App/build/DinER.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
