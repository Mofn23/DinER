name: Build iOS IPA (SideStore Compatible)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Add & Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS Xcode App & Package IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r DinER.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinER-iOS-IPA
          path: ios/App/build/DinER.ipa

      - name: Release IPA on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.0
          name: DinER Native iOS App v3.2.0 (SideStore IPA)
          body: |
            ## DinER Native iOS App v3.2.0 (SideStore / AltStore Compatible)
            
            ### 🎨 MonAI Design 1:1 Redesign Highlights:
            - **MonAI Exact Background Color (#131313)**: Updated entire app background from `#0B0B0D` to `#131313`.
            - **MonAI Transaction Pill Cards**: Enclosed transaction list items into rounded pill cards (`bg-[#1C1C1E] border border-white/10 rounded-[22px] p-3.5`).
            - **Giant Total Balance Typography**: Cloned MonAI scale & size for the main total balance display with green/red sign badges and COP suffix.
            - **Scroll-Driven Chart Bar Shrink Animation**: Category bar charts collapse and shrink smoothly as you scroll down to view transactions.
            - **Fluid Cross-Dissolve Transitions**: Added cross-dissolve fade animations when toggling between Gastos & Suscripciones, and switching income/expense filters.
            
            ### 🚀 SideStore Installation Instructions:
            1. Download `DinER.ipa` attached below to your iPhone.
            2. Open **SideStore** (or AltStore) on your iPhone.
            3. Tap **My Apps** ➔ **`+`** ➔ Select `DinER.ipa`.
            4. Enjoy DinER running 100% natively on your iPhone!
          files: ios/App/build/DinER.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
