name: Build iOS IPA (SideStore Compatible)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Add & Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS Xcode App & Package IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r DinER.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinER-iOS-IPA
          path: ios/App/build/DinER.ipa

      - name: Release IPA on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0
          name: DinER Native iOS App v3.1.0 (SideStore IPA)
          body: |
            ## DinER Native iOS App v3.1.0 (SideStore / AltStore Compatible)
            
            ### 📈 Major Transaction Sync & UX Highlights:
            - **Exact MonAI Balance Match**: Loaded all transactions from August 6 to August 11, perfectly matching MonAI's exact net available balance (`+$688,759 COP`), expenses (`$2,892,890 COP`) and incomes (`$3,581,649 COP`).
            - **Auto-Focus Description Field**: Description input in Add Transaction sheet opens the iOS keyboard automatically on open.
            - **Thousand Separator Amount Formatting**: Amounts format dynamically with thousand separators (e.g. `30.000 COP`).
            - **Dynamic Date Relative Labels**: Fixed date labeling logic so transactions dynamically transition from `Today` -> `Yesterday` -> `M/D/YY` (e.g. `8/10/26`) as days pass.
            
            ### 🚀 SideStore Installation Instructions:
            1. Download `DinER.ipa` attached below to your iPhone.
            2. Open **SideStore** (or AltStore) on your iPhone.
            3. Tap **My Apps** ➔ **`+`** ➔ Select `DinER.ipa`.
            4. Enjoy DinER running 100% natively on your iPhone!
          files: ios/App/build/DinER.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
